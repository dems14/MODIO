<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wi-Fi MIDI Controller</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<header>
    <div class="status">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Disconnected</span>
    </div>
    <div class="controls-top">
        <button type="button" id="sustainBtn">Sustain: OFF</button>
        <button type="button" id="editModeBtn">Edit Controls</button>
        <button type="button" id="resetMapBtn" title="Restore default names and MIDI numbers">Reset</button>
        <label for="midiChannel" class="channel-label">Ch:</label>
        <select id="midiChannel"></select>
        <button type="button" id="fullscreenBtn">Fullscreen</button>
    </div>
</header>

<nav class="tab-bar" id="mainTabBar" aria-label="Workspace Sections">
    <button type="button" class="tab-btn active" data-tab="all">All</button>
    <button type="button" class="tab-btn" data-tab="controls">Controls (Knobs &amp; Faders)</button>
    <button type="button" class="tab-btn" data-tab="pads">Pads</button>
    <button type="button" class="tab-btn" data-tab="chords">Chord Player</button>
</nav>

<section class="chord-sequencer-panel" id="chordPanel" aria-label="Chord Progression Player">
    <div class="chord-controls-row">
        <button type="button" id="chordPlayBtn" class="chord-play-btn">▶ Play Chords</button>

        <input
            type="text"
            id="chordProgressionInput"
            class="chord-text-input"
            placeholder="Cmaj7 | Am7 | Dm9 | G13"
            autocomplete="off"
            spellcheck="false"
        >

        <div class="chord-param-group">
            <label for="chordBpmInput">BPM</label>
            <input type="number" id="chordBpmInput" class="chord-num-input" min="30" max="300" value="110">
        </div>

        <div class="chord-param-group">
            <label for="timeSigNumerator">Time Sig</label>
            <div class="time-sig-box">
                <input type="number" id="timeSigNumerator" class="chord-num-input small" min="1" max="16" value="4">
                <span>/</span>
                <select id="timeSigDenominator">
                    <option value="2">2</option>
                    <option value="4" selected>4</option>
                    <option value="8">8</option>
                    <option value="16">16</option>
                </select>
            </div>
        </div>

        <div class="chord-param-group">
            <label for="barsPerChordSelect">Duration</label>
            <select id="barsPerChordSelect">
                <option value="0.5">1/2 Bar</option>
                <option value="1" selected>1 Bar</option>
                <option value="2">2 Bars</option>
                <option value="4">4 Bars</option>
            </select>
        </div>

        <div class="chord-param-group">
            <label for="chordOctaveSelect">Octave</label>
            <select id="chordOctaveSelect">
                <option value="2">Oct 2</option>
                <option value="3">Oct 3</option>
                <option value="4" selected>Oct 4</option>
                <option value="5">Oct 5</option>
            </select>
        </div>

        <button type="button" id="chordLoopBtn" class="active">Loop: ON</button>
    </div>

    <div class="chord-cards-strip" id="chordCardsContainer"></div>
</section>

<main class="workspace" id="mainWorkspace">
    <section class="left-section" id="controlsSection">
        <div class="knobs-row" id="knobsContainer"></div>
        <div class="faders-row" id="fadersContainer"></div>
    </section>
    <section class="pads-grid" id="padsContainer"></section>
</main>

<div class="modal-backdrop" id="customModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h3 class="modal-title" id="modalTitle">Edit Control</h3>
        </div>
        <p class="modal-message" id="modalMessage"></p>

        <div class="modal-fields" id="modalFields">
            <div class="modal-field-group">
                <label for="modalNameInput">Control Name</label>
                <div class="input-with-clear">
                    <input type="text" id="modalNameInput" class="modal-input" maxlength="40" autocomplete="off" enterkeyhint="done">
                    <button type="button" class="clear-input-btn" id="clearNameBtn" title="Clear name">✕</button>
                </div>
                <div class="preset-chips" id="presetChips"></div>
            </div>

            <div class="modal-field-group">
                <label for="modalMidiInput">
                    <span id="modalMidiLabel">MIDI CC (0 – 127)</span>
                    <span class="note-preview-badge" id="notePreviewBadge"></span>
                </label>
                <div class="stepper-row">
                    <button type="button" class="step-btn" data-step="-10">-10</button>
                    <button type="button" class="step-btn" data-step="-1">-1</button>
                    <input type="number" id="modalMidiInput" class="modal-input stepper-input" min="0" max="127" inputmode="numeric" enterkeyhint="done">
                    <button type="button" class="step-btn" data-step="1">+1</button>
                    <button type="button" class="step-btn" data-step="10">+10</button>
                </div>
            </div>
        </div>

        <div class="modal-error" id="modalError"></div>

        <div class="modal-actions">
            <button type="button" class="btn-modal" id="modalCancelBtn">Cancel</button>
            <button type="button" class="btn-modal btn-primary" id="modalConfirmBtn">Save</button>
        </div>
    </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
